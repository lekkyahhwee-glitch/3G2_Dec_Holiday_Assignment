<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>3G2 Holiday Maths Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EAF7F4; --lagoon:#0E7C86; --lagoon-d:#0A5A61; --ink:#1B1A3A;
  --mango:#FFB627; --pink:#FF2D85; --coral:#FF5A45; --leaf:#1FA463;
  --sand:#F6E3B4; --card:#FFFFFF; --line:#BFE3DD; --muted:#5B6280;
  --head-h:64px; --toolbar-h:54px; --foot-h:76px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font:18px/1.5 'Atkinson Hyperlegible',system-ui,-apple-system,sans-serif;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
h1,h2,h3,.disp{font-family:'Bricolage Grotesque','Atkinson Hyperlegible',system-ui,sans-serif;line-height:1.1;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.hidden{display:none!important}

/* sticker system: ink border + hard offset shadow */
.stk{border:2.5px solid var(--ink);border-radius:18px;box-shadow:4px 4px 0 var(--ink);background:var(--card)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:10px 20px;border:2.5px solid var(--ink);border-radius:16px;background:var(--card);box-shadow:3px 3px 0 var(--ink);font-weight:700;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.btn.primary{background:var(--mango)}
.btn.lagoon{background:var(--lagoon);color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:3px 3px 0 var(--ink)}
.chip{display:inline-block;padding:2px 10px;border-radius:999px;font-weight:700;font-size:15px;background:var(--line)}
.chip.think{background:#E6DBFF}
.chip.eoy{background:var(--mango)}
.chip.tag-tb{background:#D6ECFF}
.chip.tag-boss{background:var(--ink);color:#fff}

/* ---------- HOME ---------- */
#home{min-height:100%}
.wrap{max-width:820px;margin:0 auto;padding:16px 16px 120px}
.demo-bar{background:var(--ink);color:#fff;font-size:15px;padding:10px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.demo-bar button{background:none;border:1.5px solid #fff;border-radius:10px;padding:4px 10px;color:#fff;font-size:14px}
.topline{display:flex;align-items:center;justify-content:space-between;margin:8px 0 16px}
.wordmark{font-family:'Bricolage Grotesque';font-weight:800;font-size:26px;letter-spacing:-.02em}
.wordmark small{display:block;font:700 14px 'Atkinson Hyperlegible';color:var(--lagoon);letter-spacing:0}
.icon-btn{width:48px;height:48px;border-radius:14px;border:2.5px solid var(--ink);background:var(--card);box-shadow:3px 3px 0 var(--ink);font-size:22px}

.habitat{position:relative;overflow:hidden;background:var(--lagoon);color:#fff;border:2.5px solid var(--ink);border-radius:28px;box-shadow:5px 5px 0 var(--ink);display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:8px;padding:18px 18px 22px;min-height:290px}
.habitat::after{content:"";position:absolute;left:-10%;right:40%;bottom:-70px;height:130px;background:var(--sand);border-radius:50%;z-index:0}
.pet-stage{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.pet-stage svg{width:min(230px,100%);height:auto;overflow:visible}
.pet-name{font-family:'Bricolage Grotesque';font-weight:800;font-size:22px;color:var(--ink);margin-top:-6px}
.pet-info{position:relative;z-index:1;display:flex;flex-direction:column;gap:12px;justify-content:center}
.pet-info h2{font-size:34px;letter-spacing:-.02em}
.stat-row{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.5);border-radius:14px;padding:6px 12px;font-weight:700}
.food{align-self:stretch;background:rgba(0,0,0,.18);border-radius:999px;height:18px;overflow:hidden;border:2px solid #fff}
.food>i{display:block;height:100%;background:var(--mango);border-radius:999px;transition:width .6s cubic-bezier(.4,0,.2,1)}
.food-label{font-size:16px}

.plan{margin:22px 0 8px;padding:16px;border:2.5px solid var(--ink);border-radius:22px;background:var(--card);box-shadow:5px 5px 0 var(--ink)}
.plan-h{font-family:'Bricolage Grotesque';font-weight:800;font-size:22px;margin:0 0 4px}
.plan-sub{font-size:15px;color:var(--muted);margin:0 0 12px}
.pstep{width:100%;display:flex;align-items:center;gap:14px;text-align:left;padding:14px 16px;margin-top:10px;border:2.5px solid var(--ink);border-radius:18px;background:var(--paper);box-shadow:3px 3px 0 var(--ink)}
.pstep:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.pstep.go{background:var(--mango)}
.pstep .pn{flex:0 0 auto;width:44px;height:44px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-family:'Bricolage Grotesque';font-weight:800;font-size:22px}
.pstep b{display:block;font-size:20px;line-height:1.2}
.pstep small{display:block;font-size:15px}
.pstep .tick{margin-left:auto;font-weight:700;font-size:14px;color:var(--leaf);white-space:nowrap}
.days-h{font-size:14px;font-weight:700;color:var(--muted);margin:2px 0 8px}
.today{margin:22px 0 8px;width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px;background:var(--mango);border:2.5px solid var(--ink);border-radius:22px;box-shadow:5px 5px 0 var(--ink);text-align:left}
.today:active{transform:translate(4px,4px);box-shadow:1px 1px 0 var(--ink)}
.today b{display:block;font-family:'Bricolage Grotesque';font-size:28px;line-height:1.05}
.today span{font-size:16px}
.today .go{font-size:40px;line-height:1}

.section-h{display:flex;align-items:baseline;justify-content:space-between;margin:30px 4px 10px}
.section-h h3{font-size:24px}
.week{margin:0 0 16px;padding:14px;border:2.5px solid var(--ink);border-radius:20px;background:var(--card)}
.week-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.week-num{font-family:'Bricolage Grotesque';font-weight:800;font-size:40px;line-height:.9;color:var(--card);-webkit-text-stroke:2px var(--ink);min-width:36px;text-align:center}
.week-title{flex:1;min-width:0}
.week-title b{display:block;font-size:19px}
.week-title span{font-size:14px;color:var(--muted)}
.pdf-btn{min-height:44px;padding:6px 12px;font-size:15px;white-space:nowrap}
.days{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.day{position:relative;min-height:86px;border:2px solid var(--ink);border-radius:14px;background:var(--paper);padding:6px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:13px;line-height:1.25}
.day .dn{font-weight:700;font-size:14px}
.day .big{font-family:'Bricolage Grotesque';font-weight:800;font-size:20px}
.day.open{background:var(--card);box-shadow:3px 3px 0 var(--ink)}
.day.open .big{color:var(--lagoon)}
.day.done{background:var(--leaf);color:#fff}
.day.done::after{content:"✓";position:absolute;top:-10px;right:-8px;width:26px;height:26px;border-radius:50%;background:var(--mango);color:var(--ink);border:2px solid var(--ink);font-weight:800;display:grid;place-items:center;font-size:14px}
.day.soon{border-style:dashed;color:var(--muted);background:transparent}
.day.locked{border-style:dashed;background:transparent}
.report-btn{width:100%;margin-top:14px}

/* ---------- MODALS ---------- */
.overlay{position:fixed;inset:0;background:rgba(27,26,58,.55);z-index:50;display:block;overflow:auto;padding:24px 16px}
.modal{max-width:520px;margin:5vh auto;padding:22px}
.modal h2{font-size:28px;margin-bottom:8px}
.field{display:block;margin:14px 0}
.field span{display:block;font-weight:700;margin-bottom:6px}
.field input{width:100%;font:inherit;font-size:20px;padding:12px 14px;border:2.5px solid var(--ink);border-radius:14px;background:#fff}
.eggs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.egg-opt{border:2.5px solid var(--ink);border-radius:16px;background:var(--paper);padding:6px;display:flex;flex-direction:column;align-items:center;font-weight:700;font-size:15px}
.egg-opt[aria-pressed="true"]{background:var(--mango);box-shadow:3px 3px 0 var(--ink)}
.egg-opt svg{width:80px;height:80px}
.note{font-size:15px;color:var(--muted)}
.warn{margin:12px 0;padding:12px 14px;border-radius:14px;background:var(--coral);color:#fff;font-size:16px}
.warn b{display:block}
.homenote{margin-top:16px;padding:14px 16px;border:2px dashed var(--ink);border-radius:16px;font-size:16px;background:#fff}
.homenote b{display:block;margin-bottom:2px}
.err{color:var(--coral);font-weight:700;min-height:1.5em}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.stages{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;font-size:14px;font-weight:700}
.stages svg{width:100%;height:auto}

/* ---------- QUEST ---------- */
#quest{position:fixed;inset:0;z-index:20;background:var(--paper);display:grid;grid-template-rows:var(--head-h) minmax(0,1fr) var(--toolbar-h) var(--foot-h);grid-template-columns:minmax(0,1fr);height:100dvh}
.q-head{display:flex;align-items:center;gap:12px;padding:0 14px;background:var(--card);border-bottom:2.5px solid var(--ink)}
.q-head .ttl{flex:1;min-width:0;font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{display:flex;gap:6px}
.dots i{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink);background:#fff}
.dots i.ok{background:var(--leaf)}
.dots i.part{background:var(--mango)}
.dots i.cur{transform:scale(1.35)}
.q-scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;scroll-behavior:smooth;overscroll-behavior:contain}
.q-inner{max-width:780px;margin:0 auto;padding:20px 16px 40px}
.q-card{padding:20px}
.q-tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.q-num{font-family:'Bricolage Grotesque';font-weight:800;font-size:22px;margin-bottom:6px}
.prompt{font-size:21px;line-height:1.55}
.diagram{margin:16px 0;border:2px solid var(--ink);border-radius:16px;background:#fff;padding:6px}
.diagram svg{display:block;width:100%;height:auto}
.toolbar{display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--ink);overflow-x:auto}
.toolbar button{flex:0 0 auto;min-width:44px;height:40px;border-radius:10px;border:none;background:#fff;color:var(--ink);font-size:19px;font-weight:700}
.toolbar .tlab{color:#fff;font-size:13px;flex:0 0 auto;margin-right:4px}
.q-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;background:var(--card);border-top:2.5px solid var(--ink)}
.q-foot .btn{min-width:120px}

/* math */
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .15em;font-size:.92em;line-height:1.15}
.fr>span:first-child{border-bottom:2px solid currentColor;padding:0 .2em}
.fr>span:last-child{padding:0 .2em}
sup{font-size:.68em;line-height:0}

/* answers */
.ans-row{margin-top:18px;font-size:22px;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.bx{width:86px;height:56px;font:inherit;font-size:22px;text-align:center;border:2.5px solid var(--ink);border-radius:12px;background:#FFFBEF}
.bx.ok{background:#D9F5E6;border-color:var(--leaf)}
.bx.bad{background:#FFE3DF;border-color:var(--coral)}
.tbl{border-collapse:collapse;margin:16px 0;font-size:19px;background:#fff}
.tbl-wrap{overflow-x:auto}
.tbl td,.tbl th{border:2px solid var(--ink);padding:6px 8px;text-align:center;min-width:56px}
.tbl th{background:var(--line)}
.tbl .bx{width:64px;height:46px;font-size:19px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.opts.diag{grid-template-columns:1fr}
@media (min-width:640px){.opts.diag{grid-template-columns:1fr 1fr}}
.opt{display:flex;align-items:center;gap:12px;text-align:left;padding:12px;border:2.5px solid var(--ink);border-radius:16px;background:#fff;font-size:20px;min-height:64px}
.opts.diag .opt{flex-direction:column;align-items:stretch;padding:8px}
.opt .let{flex:0 0 auto;width:36px;height:36px;border-radius:50%;border:2.5px solid var(--ink);display:grid;place-items:center;font-weight:800;font-family:'Bricolage Grotesque';background:var(--paper)}
.opt svg{display:block;width:100%;height:auto}
.opt.bad{background:#FFE3DF;border-color:var(--coral)}
.opt.bad .let{background:var(--coral);color:#fff;border-color:var(--coral)}
.opt.good{background:#D9F5E6;border-color:var(--leaf);box-shadow:3px 3px 0 var(--leaf)}
.opt.good .let{background:var(--leaf);color:#fff;border-color:var(--leaf)}
.opt:disabled{cursor:default}
.check-row{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.hint-btn.pulse{animation:hintPulse 1.2s ease-in-out infinite}
@keyframes hintPulse{0%,100%{box-shadow:3px 3px 0 var(--ink),0 0 0 0 rgba(255,45,133,.6)}50%{box-shadow:3px 3px 0 var(--ink),0 0 0 10px rgba(255,45,133,0)}}
.feedback{margin-top:16px;font-size:19px}
.fb{padding:12px 16px;border-radius:14px;font-weight:700}
.fb.good{background:var(--leaf);color:#fff}
.fb.bad{background:var(--coral);color:#fff}
.hint-box{margin-top:14px;padding:14px 16px;border-radius:14px;background:#FFF1C9;border:2px solid var(--mango);font-size:19px}
.hint-box b{display:block;margin-bottom:2px}
.sol{margin-top:14px;padding:16px;border-radius:14px;background:#fff;border:2.5px solid var(--lagoon)}
.sol h4{margin:0 0 8px;font-size:18px;color:var(--lagoon)}
.sol .ln{padding:4px 0;font-size:20px;border-bottom:1px dashed var(--line)}
.sol .ln:last-child{border-bottom:none}
.nudge{margin-top:10px;padding:10px 14px;border-radius:12px;background:#E6DBFF;font-weight:700}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* flip card */
.flip{perspective:1200px;margin-top:8px}
.flip-in{position:relative;min-height:320px;transition:transform .6s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:2.5px solid var(--ink);border-radius:22px;padding:22px;overflow:auto}
.face.front{background:var(--mango);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;animation:glow 1.8s ease-in-out infinite}
.flip.on .face.front{animation:none}
.face.front h2{font-size:32px}
.face.front p{margin:12px 0 0;font-weight:700}
.face.back{background:#fff;transform:rotateY(180deg)}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(255,45,133,0);transform:scale(1)}50%{box-shadow:0 0 22px 6px rgba(255,45,133,.75);transform:scale(1.012)}}
.keylist{margin:0;padding:0;list-style:none}
.keylist li{padding:6px 0 6px 34px;position:relative;font-size:19px}
.keylist li::before{content:attr(data-n);position:absolute;left:0;top:7px;width:24px;height:24px;border-radius:50%;background:var(--lagoon);color:#fff;font-size:14px;font-weight:700;display:grid;place-items:center}
.ex{margin-top:12px;padding:12px;border-radius:14px;background:var(--paper)}
.ex .ln{font-size:19px;padding:2px 0}
.key{background:rgba(255,182,39,.6);padding:0 .25em;border-radius:6px;font-weight:700}

/* steps */
.expr{font-size:26px;text-align:center;margin:14px 0;padding:14px;border:2px solid var(--ink);border-radius:16px;background:#fff}
.term{padding:2px 6px;border-radius:8px;transition:background .3s}
.expr.g .t1{background:rgba(255,182,39,.65)}
.expr.g .t2{background:rgba(255,45,133,.35)}
.expr .glow{animation:termGlow 1.4s ease-in-out 2}
@keyframes termGlow{50%{box-shadow:0 0 0 4px var(--pink)}}
.diagram.glowbox{animation:termGlow 1.2s ease-in-out 2}
.stack{display:flex;flex-direction:column;gap:8px;margin:12px 0;min-height:20px}
.stack-empty{border:2px dashed var(--muted);border-radius:14px;padding:12px;text-align:center;color:var(--muted);font-size:16px}
.step{display:block;width:100%;text-align:left;padding:10px 14px;border:2.5px solid var(--ink);border-radius:14px;background:#fff;font-size:18px}
.step .sl{display:block;font-weight:700;font-size:15px;color:var(--muted)}
.step .sm{font-size:20px}
.stack .step{background:#D9F5E6;border-color:var(--leaf);cursor:default}
.stack .step .sl{color:var(--leaf)}
.stack .step .no{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--leaf);color:#fff;font-size:13px;margin-right:6px}
.pool{display:grid;gap:8px;margin-top:8px}
.pool-h{font-weight:700;margin-top:16px}

/* finish */
.finish{text-align:center;padding:24px}
.finish h2{font-size:40px;margin:6px 0}
.finish svg{width:200px;height:auto}
.bigstats{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:16px 0}
.bigstats div{padding:10px 16px;border:2.5px solid var(--ink);border-radius:16px;background:#fff;font-weight:700}
.bigstats b{display:block;font-family:'Bricolage Grotesque';font-size:30px}

/* report */
#report{position:fixed;inset:0;z-index:30;background:var(--paper);overflow-y:auto}
.rep{max-width:820px;margin:0 auto;padding:16px 16px 60px}
.rep-card{padding:18px;background:#fff}
.rep-top{display:flex;gap:14px;align-items:center}
.rep-top svg{width:84px;height:84px;flex:0 0 auto}
.rep-top h2{font-size:26px}
.rep-sum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.rep-sum div{border:2px solid var(--ink);border-radius:12px;padding:6px;text-align:center;font-size:13px;line-height:1.2}
.rep-sum b{display:block;font-family:'Bricolage Grotesque';font-size:22px}
.rep-grid{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed}
.rep-grid th{font-size:12px;color:var(--muted);font-weight:700;padding:4px 2px}
.rep-grid td{border:1.5px solid var(--ink);padding:3px 2px;text-align:center;height:46px;line-height:1.15}
.rep-grid td.wk{font-weight:700;width:56px;background:var(--paper)}
.rep-grid td.c-done{background:#D9F5E6}
.rep-grid td.c-done b{font-size:15px}
.rep-grid td.c-miss{background:#FFE3DF;color:#9B2A1E;font-weight:700}
.rep-grid td.c-soon{color:var(--muted)}
.shot{margin:14px 0;padding:14px 16px;border-radius:16px;background:var(--pink);color:#fff;font-weight:700;font-size:20px;text-align:center;border:2.5px solid var(--ink)}
.legend{font-size:13px;color:var(--muted);margin-top:8px}

/* toast */
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:80;max-width:min(92vw,520px);padding:12px 16px;border-radius:14px;background:var(--ink);color:#fff;font-weight:700;display:none}
#toast a{color:var(--mango)}

/* laser */
#laserBtn{position:fixed;right:12px;bottom:calc(var(--foot-h) + var(--toolbar-h) + 12px);z-index:60;width:44px;height:44px;border-radius:50%;border:2px solid var(--ink);background:#fff;font-size:18px;opacity:.75}
#laserBtn.on{background:var(--pink);opacity:1}
body.at-home #laserBtn{bottom:16px}
#laser{position:fixed;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:#ff1744;box-shadow:0 0 16px 6px rgba(255,23,68,.6);pointer-events:none;z-index:90;display:none}

/* pet motion */
.wobble{transform-origin:100px 176px;animation:wobble 2.6s ease-in-out infinite}
@keyframes wobble{0%,70%,100%{transform:rotate(0)}76%{transform:rotate(-6deg)}84%{transform:rotate(5deg)}92%{transform:rotate(-2deg)}}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.hop{animation:hop .7s cubic-bezier(.4,0,.2,1) 3}
@keyframes hop{50%{transform:translateY(-26px)}}

@media (max-width:560px){
  .habitat{grid-template-columns:1fr;text-align:center}
  .habitat::after{left:-20%;right:-20%}
  .pet-info{order:-1;align-items:center}
  .pet-info h2{font-size:28px}
  .stat-row{justify-content:center}
  .pet-stage svg{width:190px}

<script>
/* =========================================================
   CONFIG — edit these for the full pack

  unlockAll: false,          // true = everything open regardless of date

if(/[?&]preview\b/.test(location.search)){CONFIG.unlockAll=true;CONFIG.demo=true;CONFIG.storeKey+='_preview';}

/* =========================================================
   UTILITIES
   ========================================================= */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function xmur3(str){let h=1779033703^str.length;for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19;}return function(){h=Math.imul(h^(h>>>16),2246822507);h=Math.imul(h^(h>>>13),3266489909);return (h^=h>>>16)>>>0;}}

const ri = (rng,a,b) => a + Math.floor(rng()*(b-a+1));

const LET = ['A','B','C','D'];
const nf = n => (n<0?'−':'') + Math.abs(n);           // number with true minus
const rsf = (x,n=3) => x===0?0:parseFloat(x.toPrecision(n));          // round to n s.f.
const rdp = (x,n=2) => Math.round(x*Math.pow(10,n))/Math.pow(10,n);   // round to n d.p.
const fx = (x,n=2) => nf(rdp(x,n));                                    // display rounded, true minus

function poly(terms){ // [[coef,'x^{2}'],...] -> "3x^{2} − 5x + 4"
  let s='';

    if(c===0) continue;

function parseStudentNumber(raw){
  if(raw==null) return NaN;

  const mx=s.match(/^([-+]?)(\d+)\s+(\d+)\s*\/\s*(\d+)$/); // mixed number like 12 3/4
  if(mx){const d=parseFloat(mx[4]);if(d===0)return NaN;const v=parseFloat(mx[2])+parseFloat(mx[3])/d;return mx[1]==='-'?-v:v;}
  s=s.replace(/\s+/g,'');
  if(/^-?\d+,\d+$/.test(s)) s=s.replace(',','.');
  const fm=s.match(/^([-+]?\d+(?:\.\d+)?)\/([-+]?\d+(?:\.\d+)?)$/);
  if(fm){const d=parseFloat(fm[2]);return d===0?NaN:parseFloat(fm[1])/d;}
  if(!/^[-+]?(\d+\.?\d*|\.\d+)$/.test(s)) return NaN;

function toast(html, ms=4000){const t=$('#toast');t.innerHTML=html;t.style.display='block';clearTimeout(toast._t);toast._t=setTimeout(()=>t.style.display='none',ms);}

/* =========================================================
   MINI MATH MARKUP:  x^{2}   \f{num}{den}
   ========================================================= */
function parseM(s){
  const out=[];let i=0,buf='';
  const flush=()=>{if(buf){out.push({k:'t',v:buf});buf='';}};
  const group=()=>{ // s[i]==='{'
    let depth=0,start=i+1;
    for(;i<s.length;i++){ if(s[i]==='{')depth++; else if(s[i]==='}'){depth--; if(depth===0){const inner=s.slice(start,i);i++;return inner;}} }
    return s.slice(start);
  };
  while(i<s.length){
    if(s[i]==='^'&&s[i+1]==='{'){flush();i++;out.push({k:'sup',v:parseM(group())});}
    else if(s[i]==='\\'&&s[i+1]==='f'&&s[i+2]==='{'){flush();i+=2;const n=group();const d=group();out.push({k:'frac',n:parseM(n),d:parseM(d)});}
    else {buf+=s[i];i++;}
  }

}
function mHTML(s){
  const r=nodes=>nodes.map(n=>n.k==='t'?esc(n.v):n.k==='sup'?'<sup>'+r(n.v)+'</sup>':'<span class="fr"><span>'+r(n.n)+'</span><span>'+r(n.d)+'</span></span>').join('');
  return r(parseM(s));
}
const plain = nodes => nodes.map(n=>n.k==='t'?n.v:n.k==='sup'?plain(n.v):plain(n.n)+'/'+plain(n.d)).join('');

/* =========================================================
   DRAWINGS — one spec, rendered to SVG (app) and jsPDF (worksheet)
   spec: {xmin,xmax,ymin,ymax,equal,W,H,grid:{dx,dy},axes:{xstep,ystep},fs,items:[...]}
   items: {k:'path',pts,c,closed,dash} {k:'cross',x,y} {k:'dot',x,y} {k:'label',x,y,t,dx,dy}
   ========================================================= */
const COL = {curve:'#0E7C86',line:'#FF2D85',tri:'#1B1A3A',arc:'#6B7290',ink:'#1B1A3A',seg:'#1B1A3A'};
const WID = {curve:3,line:3.5,tri:2.5,arc:1.6,ink:2,seg:2.5};
function clipSeg(a,b,sp){
  let t0=0,t1=1;const dx=b[0]-a[0],dy=b[1]-a[1];

  for(let i=0;i<4;i++){if(Math.abs(P[i])<1e-12){if(Qv[i]<0)return null;continue;}const r=Qv[i]/P[i];if(P[i]<0){if(r>t1)return null;if(r>t0)t0=r;}else{if(r<t0)return null;if(r<t1)t1=r;}}

function svgFrame(sp){
  const W=sp.W||420, pad=sp.pad!=null?sp.pad:(sp.axes?30:16);
  const sx=(W-2*pad)/(sp.xmax-sp.xmin);

  else {H=sp.H||W;sy=(H-2*pad)/(sp.ymax-sp.ymin);}
  return {W,H,pad,X:x=>pad+(x-sp.xmin)*sx,Y:y=>H-pad-(y-sp.ymin)*sy};
}
function toSVG(sp){
  const f=svgFrame(sp),{X,Y}=f,fs=sp.fs||16;let o='';
  if(sp.grid){
    for(let x=Math.ceil(sp.xmin/sp.grid.dx)*sp.grid.dx;x<=sp.xmax+1e-9;x+=sp.grid.dx) o+=`<line x1="${X(x)}" y1="${Y(sp.ymin)}" x2="${X(x)}" y2="${Y(sp.ymax)}" stroke="#CBE5E0" stroke-width="1" vector-effect="non-scaling-stroke"/>`;
    for(let y=Math.ceil(sp.ymin/sp.grid.dy)*sp.grid.dy;y<=sp.ymax+1e-9;y+=sp.grid.dy) o+=`<line x1="${X(sp.xmin)}" y1="${Y(y)}" x2="${X(sp.xmax)}" y2="${Y(y)}" stroke="#CBE5E0" stroke-width="1" vector-effect="non-scaling-stroke"/>`;
  }
  if(sp.axes){
    const a=sp.axes;
    if(sp.ymin<=0&&sp.ymax>=0) o+=`<line x1="${X(sp.xmin)}" y1="${Y(0)}" x2="${X(sp.xmax)}" y2="${Y(0)}" stroke="#1B1A3A" stroke-width="1.6" vector-effect="non-scaling-stroke"/><text x="${X(sp.xmax)-4}" y="${Y(0)-8}" font-size="${fs}" text-anchor="end" font-style="italic" fill="#1B1A3A">x</text>`;
    if(sp.xmin<=0&&sp.xmax>=0) o+=`<line x1="${X(0)}" y1="${Y(sp.ymin)}" x2="${X(0)}" y2="${Y(sp.ymax)}" stroke="#1B1A3A" stroke-width="1.6" vector-effect="non-scaling-stroke"/><text x="${X(0)+8}" y="${Y(sp.ymax)+fs}" font-size="${fs}" font-style="italic" fill="#1B1A3A">y</text>`;
    const y0=(sp.ymin<=0&&sp.ymax>=0)?0:sp.ymin, x0=(sp.xmin<=0&&sp.xmax>=0)?0:sp.xmin;
    if(!a.nonum) for(let x=Math.ceil(sp.xmin/a.xstep)*a.xstep;x<=sp.xmax+1e-9;x+=a.xstep){ if(Math.abs(x)<1e-9) continue; o+=`<text x="${X(x)}" y="${Y(y0)+fs+2}" font-size="${fs*0.82}" text-anchor="middle" fill="#1B1A3A" stroke="#fff" stroke-width="4" paint-order="stroke">${nf(Math.round(x*100)/100)}</text>`; }
    if(!a.nonum) for(let y=Math.ceil(sp.ymin/a.ystep)*a.ystep;y<=sp.ymax+1e-9;y+=a.ystep){ if(Math.abs(y)<1e-9){o+=`<text x="${X(x0)-6}" y="${Y(0)+fs+2}" font-size="${fs*0.82}" text-anchor="end" fill="#1B1A3A" stroke="#fff" stroke-width="4" paint-order="stroke">0</text>`;continue;} o+=`<text x="${X(x0)-6}" y="${Y(y)+fs*0.3}" font-size="${fs*0.82}" text-anchor="end" fill="#1B1A3A" stroke="#fff" stroke-width="4" paint-order="stroke">${nf(Math.round(y*100)/100)}</text>`; }
  }

  return `<svg viewBox="0 0 ${f.W} ${f.H.toFixed(1)}" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Atkinson Hyperlegible, sans-serif"><defs><clipPath id="${cid}"><rect x="${X(sp.xmin)}" y="${Y(sp.ymax)}" width="${X(sp.xmax)-X(sp.xmin)}" height="${Y(sp.ymin)-Y(sp.ymax)}"/></clipPath></defs>${o}</svg>`;
}
toSVG.n=0;
function svgAspect(sp){const f=svgFrame(sp);return f.H/f.W;}

/* curve helpers */
function catmull(pts,n=12){
  const out=[];
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||pts[i+1];
    for(let t=0;t<n;t++){const s=t/n,s2=s*s,s3=s2*s;
      out.push([0.5*((2*p1[0])+(-p0[0]+p2[0])*s+(2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*s2+(-p0[0]+3*p1[0]-3*p2[0]+p3[0])*s3),
                0.5*((2*p1[1])+(-p0[1]+p2[1])*s+(2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*s2+(-p0[1]+3*p1[1]-3*p2[1]+p3[1])*s3)]);}
  }
  out.push(pts[pts.length-1]);return out;
}
function sample(f,a,b,n=90){const o=[];for(let i=0;i<=n;i++){const x=a+(b-a)*i/n;o.push([x,f(x)]);}return o;}
function clipLine(x1,y1,m,xa,xb,ymin,ymax){ // line through (x1,y1) slope m, limited to [xa,xb] and y range
  let lo=xa,hi=xb;
  if(Math.abs(m)>1e-9){const xA=x1+(ymin-y1)/m,xB=x1+(ymax-y1)/m;lo=Math.max(lo,Math.min(xA,xB));hi=Math.min(hi,Math.max(xA,xB));}
  return [[lo,y1+m*(lo-x1)],[hi,y1+m*(hi-x1)]];
}

/* geometry helpers */
const V=(x,y)=>({x,y}), vadd=(a,b)=>V(a.x+b.x,a.y+b.y), vsub=(a,b)=>V(a.x-b.x,a.y-b.y), vmul=(a,k)=>V(a.x*k,a.y*k);
const vlen=a=>Math.hypot(a.x,a.y), vnorm=a=>vmul(a,1/vlen(a)), vperp=a=>V(-a.y,a.x), vdot=(a,b)=>a.x*b.x+a.y*b.y, vmid=(a,b)=>V((a.x+b.x)/2,(a.y+b.y)/2);
const P2=p=>[p.x,p.y];
const RECT={x0:0.15,y0:0.15,x1:9.85,y1:9.85};
function clipParam(P,d,tmin,tmax){
  for(const [p,dd,lo,hi] of [[P.x,d.x,RECT.x0,RECT.x1],[P.y,d.y,RECT.y0,RECT.y1]]){
    if(Math.abs(dd)<1e-9){continue;}
    const t1=(lo-p)/dd,t2=(hi-p)/dd;tmin=Math.max(tmin,Math.min(t1,t2));tmax=Math.min(tmax,Math.max(t1,t2));

function fullLine(P,d){const [a,b]=clipParam(P,d,-1e9,1e9);return [P2(vadd(P,vmul(d,a))),P2(vadd(P,vmul(d,b)))];}

function arcAround(C,r,towards,spreadDeg=13){
  const a=Math.atan2(towards.y-C.y,towards.x-C.x),s=spreadDeg*Math.PI/180,pts=[];

function triItems(A,B,C){
  const G=V((A.x+B.x+C.x)/3,(A.y+B.y+C.y)/3);
  const lab=(P,t)=>{const d=vnorm(vsub(P,G));const q=vadd(P,vmul(d,0.5));return {k:'label',x:q.x,y:q.y,t,size:24};};

function conPerpBis(P,Q){

}

  const pb=conPerpBis(P,Q);
  return [...pb.items.slice(0,4),{k:'path',pts:ray(V0,pb.M),c:'line'}];
}
function conAltitude(V0,P,Q){ // from V0 perpendicular to line PQ
  const F=foot(V0,P,Q),h=vlen(vsub(V0,F)),r=h*1.12,u=vnorm(vsub(Q,P)),w=Math.sqrt(r*r-h*h);

function conAngleBis(B0,P,Q){ // bisector of angle P-B0-Q

/* ---------- generic diagram helpers for content ----------

   sides:[['A','B','6 cm']], angles:[['A','B','C','34°']] (angle at middle letter),
   right:[['A','B','C']] (right angle at B), ticks:[['A','B',1]], par:[['D','E'],['B','C']],

function triDiagram(o){
  const P=o.pts,items=[],names=Object.keys(P),vv=k=>V(P[k][0],P[k][1]);
  const xs=names.map(k=>P[k][0]),ys=names.map(k=>P[k][1]),m=o.margin!=null?o.margin:2.0;
  const xmin=Math.min(...xs)-m,xmax=Math.max(...xs)+m,ymin=Math.min(...ys)-m,ymax=Math.max(...ys)+m;
  const scale=Math.max(xmax-xmin,ymax-ymin)/10; // label offsets scale with figure
  const G=V(xs.reduce((a,b)=>a+b,0)/xs.length,ys.reduce((a,b)=>a+b,0)/ys.length);
  (o.polys||[]).forEach(pl=>items.push({k:'path',pts:pl.map(k=>P[k]),closed:pl.length>2,c:'tri'}));
  (o.segs||[]).forEach(([a,b])=>items.push({k:'path',pts:[P[a],P[b]],c:'tri'}));

/* fnSpec({xmin,xmax,ymin,ymax,fns:[{f,a,b,c:'curve'}],grid:{dx,dy},axes:{xstep,ystep,nonum},items:[],H,W,fs}) */
function fnSpec(o){
  const items=[];
  (o.fns||[]).forEach(fn=>{const a=fn.a!=null?fn.a:o.xmin,b=fn.b!=null?fn.b:o.xmax;
    const pts=[];const N=fn.n||120;for(let i=0;i<=N;i++){const x=a+(b-a)*i/N,y=fn.f(x);if(isFinite(y))pts.push([x,Math.max(o.ymin-50,Math.min(o.ymax+50,y))]);}
    items.push({k:'path',pts,c:fn.c||'curve',dash:fn.dash});});
  return {xmin:o.xmin,xmax:o.xmax,ymin:o.ymin,ymax:o.ymax,W:o.W||420,H:o.H||420,grid:o.grid||null,axes:o.axes||null,fs:o.fs||18,items:[...items,...(o.items||[])]};
}

function makeTriangle(rng){
  let best=null;
  for(let i=0;i<120;i++){
    const A=V(0.9+rng()*1.4,2.3+rng()*1.0),B=V(7.7+rng()*1.4,2.2+rng()*1.1),C=V(2.6+rng()*4.6,7.3+rng()*1.2);
    const aA=angleAt(A,B,C),aB=angleAt(B,A,C),aC=180-aA-aB;
    if(Math.min(aA,aB,aC)<36) continue;
    const ab=vsub(B,A),t=vdot(vsub(C,A),ab)/vdot(ab,ab);
    if(t<0.12||t>0.88||Math.abs(t-0.5)<0.17) continue;
    const M=vmid(A,C),bis=vadd(vnorm(vsub(A,B)),vnorm(vsub(C,B))),Fb=foot(B,A,C);
    const ang=(u,v)=>Math.acos(Math.max(-1,Math.min(1,vdot(vnorm(u),vnorm(v)))))*180/Math.PI;
    if(ang(bis,vsub(M,B))<7||ang(bis,vsub(Fb,B))<7||ang(vsub(M,B),vsub(Fb,B))<7) continue;
    best={A,B,C};break;
  }
  return best||{A:V(1.2,2.6),B:V(8.8,2.4),C:V(6.6,8.2)};
}

/* quadratic context shared by Week 4 Day 1 */
function quadCtx(rng){
  const r1=-ri(rng,1,4),r2=ri(rng,1,3);
  const b=-(r1+r2),c=r1*r2,h=(r1+r2)/2,x0=Math.round(h)-4;
  const xs=Array.from({length:8},(_,i)=>x0+i), f=x=>x*x+b*x+c, ys=xs.map(f);
  const yv=f(h),ymax=Math.max(...ys);
  const ystep=(ymax-yv)>9?2:1;
  const ymin=Math.floor((yv-1.2)/ystep)*ystep, ytop=Math.ceil((ymax+1)/ystep)*ystep;
  const expr=poly([[1,'x^{2}'],[b,'x'],[c,'']]);
  let a1;{const cand=xs.slice(1,7).filter(a=>a!==h&&Math.abs(2*a+b)>=1&&Math.abs(2*a+b)<=4);a1=cand[Math.floor(rng()*cand.length)];}
  let a2;{const cand=xs.slice(1,7).filter(a=>a!==h&&a!==a1&&Math.abs(2*a+b)>=1&&Math.abs(2*a+b)<=5);a2=cand[Math.floor(rng()*cand.length)];}
  return {r1,r2,b,c,h,xs,ys,f,ystep,ymin,ytop,expr,a1,a2};
}
function quadBase(q,extra){
  return {xmin:q.xs[0]-0.5,xmax:q.xs[7]+0.5,ymin:q.ymin,ymax:q.ytop,W:420,H:420,
    grid:{dx:1,dy:1},axes:{xstep:1,ystep:q.ystep},fs:18,items:extra||[]};
}

(()=>{
const f2=v=>{const t=Math.abs(v).toFixed(2);return (v<0&&t!=='0.00'?'−':'')+t;};
const f4=v=>{const t=Math.abs(v).toFixed(4);return (v<0&&t!=='0.0000'?'−':'')+t;};
const cx=(c,v='x')=>(c===1?'':c===-1?'−':nf(c))+v;
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b];}return a;};
const sg=n=>(n<0?'− ':'+ ')+Math.abs(n);                 // "+ 3" / "− 3"
const lin=(c,v='x')=>`(${v} ${sg(c)})`;                    // "(x − 3)"
const sgx=(c,v)=>(c<0?'− ':'+ ')+(Math.abs(c)===1?'':Math.abs(c))+v; // "+ 2x" / "− x"
const fr=(n,d)=>{if(d<0){n=-n;d=-d;}const g=gcd(n,d)||1;n/=g;d/=g;if(d===1)return nf(n);return (n<0?'−':'')+`\\f{${Math.abs(n)}}{${d}}`;};
const isSq=n=>n>=0&&Math.round(Math.sqrt(n))**2===n;
const sgnR=rng=>rng()<0.5?-1:1;
const eqOf=(a,b,c)=>poly([[a,'x^{2}'],[b,'x'],[c,'']])+' = 0';
const sq=(h,k)=>`(x ${sg(h)})^{2}`+(k===0?'':' '+sg(k));
// non-monic factorisable: (p x + r)(x + s)
function nonMonic(rng){
  let p,r,s;
  do{p=[2,3,5][ri(rng,0,2)];r=ri(rng,1,7)*sgnR(rng);s=ri(rng,1,7)*sgnR(rng);}while(gcd(r,p)!==1||p*s+r===0);
  return {p,r,s,a:p,b:p*s+r,c:r*s};
}
function formulaLines(a,b,c){
  const d=b*b-4*a*c,r1=(-b+Math.sqrt(d))/(2*a),r2=(-b-Math.sqrt(d))/(2*a);
  return {d,r1,r2,lines:[
    `a = ${nf(a)}`,`b = ${nf(b)}`,`c = ${nf(c)}`,
    `x = \\f{−(${nf(b)}) ± √((${nf(b)})^{2} − 4(${nf(a)})(${nf(c)}))}{2(${nf(a)})}`,
    `x = \\f{${nf(-b)} ± √${d}}{${2*a}}`,
    `x = \\f{${nf(-b)} + ${Math.sqrt(d).toFixed(3)}}{${2*a}}`,
    `x = \\f{${nf(-b)} − ${Math.sqrt(d).toFixed(3)}}{${2*a}}`,
    `x = ${f2(r1)} or x = ${f2(r2)}`]};
}

(()=>{
const f2=v=>{const t=Math.abs(v).toFixed(2);return (v<0&&t!=='0.00'?'−':'')+t;};
const f4=v=>{const t=Math.abs(v).toFixed(4);return (v<0&&t!=='0.0000'?'−':'')+t;};
const cx=(c,v='x')=>(c===1?'':c===-1?'−':nf(c))+v;
const sg=n=>(n<0?'− ':'+ ')+Math.abs(n);
const lin=(c,v='x')=>`(${v} ${sg(c)})`;
const isSq=n=>n>=0&&Math.round(Math.sqrt(n))**2===n;
const sgnR=rng=>rng()<0.5?-1:1;
const eqOf=(a,b,c)=>poly([[a,'x^{2}'],[b,'x'],[c,'']])+' = 0';
function rectDiagram(lenLab,widLab){
  return triDiagram({pts:{A:[0,0],B:[7,0],C:[7,3.6],D:[0,3.6]},polys:[['A','B','C','D']],hide:['A','B','C','D'],
    sides:[['A','B',lenLab],['B','C',widLab]],margin:1.6});
}
function formulaLines(a,b,c){
  const d=b*b-4*a*c,r1=(-b+Math.sqrt(d))/(2*a),r2=(-b-Math.sqrt(d))/(2*a);
  return {d,r1,r2,lines:[`a = ${nf(a)}`,`b = ${nf(b)}`,`c = ${nf(c)}`,
    `x = \\f{−(${nf(b)}) ± √((${nf(b)})^{2} − 4(${nf(a)})(${nf(c)}))}{2(${nf(a)})}`,
    `x = \\f{${nf(-b)} ± √${d}}{${2*a}}`,
    `x = \\f{${nf(-b)} + ${Math.sqrt(d).toFixed(3)}}{${2*a}}`,
    `x = \\f{${nf(-b)} − ${Math.sqrt(d).toFixed(3)}}{${2*a}}`,
    `x = ${f2(r1)} or x = ${f2(r2)}`]};
}

/* shared context for Week 4 Days 2–3: curve with integer minimum point */
function quadCtxI(rng){
  const d=2*ri(rng,2,3),r1=-ri(rng,1,6),r2=r1+d,h=(r1+r2)/2;
  const b=-(r1+r2),c=r1*r2,f=x=>x*x+b*x+c,yv=f(h);
  const x0=h-4,x1=h+4,ytop=f(x0)+1,ystep=(ytop-yv)>12?2:1;
  return {r1,r2,b,c,h,f,yv,x0,x1,ystep,ymin:Math.floor((yv-1.5)/ystep)*ystep,ytop:Math.ceil(ytop/ystep)*ystep,expr:poly([[1,'x^{2}'],[b,'x'],[c,'']])};
}
function quadGraphI(q){
  return fnSpec({xmin:q.x0-0.5,xmax:q.x1+0.5,ymin:q.ymin,ymax:q.ytop,W:420,H:440,grid:{dx:1,dy:1},axes:{xstep:1,ystep:q.ystep},fs:17,fns:[{f:q.f,a:q.x0,b:q.x1}]});
}

(function(){
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b];}return a||1;};
const pt=(x,y)=>`(${nf(x)}, ${nf(y)})`;
const minus=(a,b)=>b<0?`${nf(a)} − (${nf(b)})`:`${nf(a)} − ${b}`;
function frac(num,den){ // simplified stacked fraction string with leading minus
  if(den<0){num=-num;den=-den;}
  const g=gcd(num,den);num/=g;den/=g;
  if(den===1)return nf(num);
  return (num<0?'−':'')+`\\f{${Math.abs(num)}}{${den}}`;
}
function lineStr(mStr,c){ // mStr already formatted coefficient ('' for 1, '−' for -1)
  const cs=c===0?'':(c<0?` − ${Math.abs(c)}`:` + ${c}`);
  return `y = ${mStr}x${cs}`;
}
const coefStr=m=>m===1?'':m===-1?'−':nf(m);

/* sketch-style graph for shape questions */
function sketch(type,s){
  const fns=[];
  if(type==='lin')fns.push({f:x=>s*1.6*x});
  if(type==='quad')fns.push({f:x=>s*0.65*x*x});
  if(type==='cub')fns.push({f:x=>s*0.22*x*x*x});
  if(type==='rec'){fns.push({f:x=>s*2/x,a:-3,b:-0.32});fns.push({f:x=>s*2/x,a:0.32,b:3});}
  if(type==='exp')fns.push({f:x=>Math.pow(1.9,x),a:-3,b:2.8});
  return fnSpec({xmin:-3,xmax:3,ymin:-6,ymax:6,W:420,H:360,axes:{xstep:1,ystep:1,nonum:true},fns,
    items:[{k:'label',x:-0.28,y:-0.6,t:'O',size:18}]});
}
const SHAPE_NAME={lin:'a straight line through O',quad:'a U-shaped curve',cub:'an S-shaped curve through O',rec:'two separate curves',exp:'a curve that stays above the x-axis'};

/* depreciation graph: V in thousands of dollars */
function valueGraph(V0,r){
  const top=V0/1000+1,items=[];
  for(let t=0;t<=8;t++)items.push({k:'path',pts:[[t,0],[t,top]],c:'arc',w:1});
  for(let v=0;v<=top+1e-9;v+=0.5)items.push({k:'path',pts:[[0,v],[8.4,v]],c:'arc',w:v%2===0?1.4:0.8});
  items.push({k:'path',pts:[[0,0],[8.6,0]],c:'ink',w:2.2},{k:'path',pts:[[0,0],[0,top+0.4]],c:'ink',w:2.2});
  for(let t=1;t<=8;t++)items.push({k:'label',x:t,y:-0.45,t:String(t),size:15});
  for(let v=0;v<=top+1e-9;v+=1)items.push({k:'label',x:-0.8,y:v,t:String(v*1000),size:13});
  items.push({k:'label',x:0.9,y:top+0.75,t:'V ($)',size:16},{k:'label',x:7.4,y:-1.05,t:'t (years)',size:15});
  const pts=[];for(let i=0;i<=80;i++){const t=8*i/80;pts.push([t,V0*Math.pow(r,t)/1000]);}
  items.push({k:'path',pts,c:'curve'});
  return {xmin:-1.6,xmax:8.8,ymin:-1.4,ymax:top+1.1,W:440,H:460,pad:6,fs:16,items};
}

function w78mcq(rng,list){const order=shuffle(rng,[0,1,2,3]);return {opts:order.map(i=>({m:list[i]})),correct:order.indexOf(0),L:i=>LET[order.indexOf(i)]};}
function w78fig(o){ // multi-shape diagram: labels pushed away from each shape's own centre
  const P=o.pts,names=Object.keys(P),m=o.margin!=null?o.margin:1.3;
  const xs=names.map(k=>P[k][0]),ys=names.map(k=>P[k][1]);
  const scale=Math.max(Math.max(...xs)-Math.min(...xs)+2*m,Math.max(...ys)-Math.min(...ys)+2*m)/10;
  const groups=o.groups||[names.filter(k=>!(o.hide||[]).includes(k))];
  const cen=ks=>{const g=groups.find(g=>ks.every(k=>g.includes(k)))||groups.find(g=>g.includes(ks[0]))||names;return V(g.reduce((s,k)=>s+P[k][0],0)/g.length,g.reduce((s,k)=>s+P[k][1],0)/g.length);};
  const extra=[];
  names.forEach(k=>{if((o.hide||[]).includes(k))return;const A=V(P[k][0],P[k][1]);let d=vsub(A,cen([k]));if(vlen(d)<1e-6)d=V(0,1);d=vnorm(d);const q=vadd(A,vmul(d,0.62*scale));extra.push({k:'label',x:q.x,y:q.y,t:k,size:22});});
  (o.sides||[]).forEach(([a,b,t,flip])=>{const A=V(P[a][0],P[a][1]),B=V(P[b][0],P[b][1]),M=vmid(A,B),u=vnorm(vsub(B,A));let nn=vperp(u);
    if(vdot(nn,vsub(M,cen([a,b])))<0)nn=vmul(nn,-1);if(flip)nn=vmul(nn,-1);
    const q=vadd(M,vmul(nn,0.55*scale+Math.abs(nn.x)*0.09*t.length*scale));extra.push({k:'label',x:q.x,y:q.y,t,size:19});});
  (o.texts||[]).forEach(([k,t])=>extra.push({k:'label',x:P[k][0],y:P[k][1],t,size:20,color:'#0E7C86'}));
  const spec=triDiagram(Object.assign({},o,{sides:[],hide:names,extra:[...extra,...(o.extra||[])]}));
  return spec;
}
const w78n = x => String(rdp(x,2));
const DEG=Math.PI/180;
function w7comp(w,h,t){ // composite shape A + rotated copy B (points)
  const X0=w+2.4;
  return {A1:[0,0],A2:[w,0],A3:[w,h],A4:[w/2,h+t],A5:[0,h],
    B1:[X0,w],B2:[X0,0],B3:[X0+h,0],B4:[X0+h+t,w/2],B5:[X0+h,w],
    SA:[w/2,Math.max(h+t,w)+1.4],SB:[X0+(h+t)/2,Math.max(h+t,w)+1.4]};
}
function w7compSpec(P,sides,angles){
  return w78fig({pts:P,groups:[['A1','A2','A3','A4','A5'],['B1','B2','B3','B4','B5']],hide:Object.keys(P),

const w8f=(x,n=3)=>{const r=rsf(x,n);return Math.abs(r)>=Math.pow(10,n)?String(Math.round(r)):r.toPrecision(n);};
const w8r1=(x)=>rdp(x,1).toFixed(1);
function w8distinct(vals,step){const seen=new Set();return vals.map(v=>{let x=v,k=1;while(seen.has(x)){x=rdp(parseFloat(v)+k*step,1).toFixed(1);k++;}seen.add(x);return x;});}
function w8ramp(rng){
  const L=ri(rng,35,60)/10,th=ri(rng,10,14),g=th+ri(rng,2,4),H=L*Math.sin(th*DEG),Hd=rsf(H,3);
  const meets=rng()<0.5;let L2,X;
  for(let i=0;i<20;i++){
    const tgt=meets?g-1-rng()*2.5:g+1+rng()*3;
    L2=rdp(Hd/Math.sin(tgt*DEG),1);X=Math.asin(Math.min(1,Hd/L2))/DEG;
    if(meets?X<=g-0.5:X>=g+0.5)break;
  }
  return {L,th,g,H,Hd,L2,X,meets};
}
function w8rampSpec(L,th,labs){
  const s=10/(L*Math.cos(th*DEG));
  const pts={G:[0,0],T:[L*Math.cos(th*DEG)*s,0],R:[L*Math.cos(th*DEG)*s,L*Math.sin(th*DEG)*s]};
  return w8tri({pts,polys:[['G','T','R']],right:[['G','T','R']],sides:labs.sides,angles:labs.angles,margin:3.8});
}

let S = load();
function load(){try{const r=localStorage.getItem(CONFIG.storeKey);if(r)return JSON.parse(r);}catch(e){}return {profile:null,quests:{}};}
function save(){try{localStorage.setItem(CONFIG.storeKey,JSON.stringify(S));}catch(e){}}
const studentKey = () => S.profile ? S.profile.name.trim().toLowerCase().replace(/\s+/g,' ') : 'guest';
function findItem(qid,key){const d=QUESTS[qid];if(!d)return null;return d.items.find(x=>x.key===key)||null;}
function genItem(it,seed,ctxDef,ctxSeed){
  const ctx=ctxDef?ctxDef(rngFor(ctxSeed)):null;
  return Object.assign({type:it.type,key:it.key,skill:it.skill,eoy:it.eoy,thinking:it.thinking},it.gen(rngFor(seed),ctx));
}
function autoPool(week){ // every scored, non-ref, non-steps item from earlier weeks
  const out=[];Object.keys(QUESTS).forEach(q=>{const d=QUESTS[q];if(d.week>=week)return;d.items.forEach(it=>{if(it.type==='boxes'||it.type==='mcq'){if(!it.noThrowback)out.push([q,it.key]);}});});
  return out;
}
function buildQuest(qid){
  const def=QUESTS[qid],sk=studentKey();
  return def.items.map(it=>{
    if(it.type==='ref'){
      const pr=rngFor(sk+'|'+qid+'|'+it.key+'|pick');
      let pool=it.pool==='auto'?autoPool(def.week):(it.pool||[[it.from,it.src]]);
      pool=pool.filter(([q,k])=>findItem(q,k));
      const [fq,fk]=pool[Math.floor(pr()*pool.length)];
      const src=findItem(fq,fk);
      const g=genItem(src,sk+'|'+qid+'|'+it.key,QUESTS[fq].ctx,sk+'|'+qid+'|'+it.key+'|ctx');
      g.key=it.key;g.tag=it.tag||'Throwback';g.from='Week '+QUESTS[fq].week;
      delete g.pdfPrompt;g.pdfNoDiagram=false; // a ref stands alone: print its own diagram
      return g;
    }
    return genItem(it,sk+'|'+qid+'|'+it.key,def.ctx,sk+'|'+qid+'|ctx');
  });
}
function qState(qid){S.quests[qid]=S.quests[qid]||{items:{},page:0};return S.quests[qid];}
function iState(qid,i){const q=qState(qid);q.items[i]=q.items[i]||{tries:0,done:false,correct:false,revealed:false,food:0,wrong:[],vals:[],hint:false,steps:0,seen:false};return q.items[i];}
function questStats(qid){
  const def=QUESTS[qid];const qs=S.quests[qid];
  const scored=def.items.map((it,i)=>[it,i]).filter(([it])=>it.type!=='recap');
  let correct=0,tries=0,done=0,food=0;
  for(const [,i] of scored){const st=qs&&qs.items[i];if(!st)continue;tries+=st.tries;food+=st.food||0;if(st.done)done++;if(st.correct)correct++;}
  return {total:scored.length,correct,tries,done,food,complete:!!(qs&&qs.completedAt),completedAt:qs&&qs.completedAt,pct:scored.length?Math.round(100*correct/scored.length):0};
}
function totalFood(){return Object.keys(QUESTS).reduce((s,q)=>s+questStats(q).food,0);}
const STAGES=[0,12,48,120,240,380];
const STAGE_NAMES=['Egg','Cracking','Hatchling','Junior','Grown-up','Holiday champion'];
function stageOf(food){let s=0;STAGES.forEach((t,i)=>{if(food>=t)s=i;});return s;}
function dayDate(w,d){return addDays(CONFIG.startDate,(w-1)*7+(d-1));}
function isOpen(w,d){return CONFIG.unlockAll||todayISO()>=dayDate(w,d);}
function streakInfo(){
  const done=new Set(Object.values(S.quests).filter(q=>q.completedAt).map(q=>q.completedAt));
  const count=Object.values(S.quests).filter(q=>q.completedAt).length;
  let freezes=Math.min(3,Math.floor(count/5)),streak=0,d=todayISO(),first=true;
  for(let k=0;k<120;k++){
    const wd=new Date(d+'T00:00:00').getDay();
    if(done.has(d))streak++;
    else if(wd===0||wd===6||first){} // weekends and today never break a streak
    else if(freezes>0)freezes--;
    else break;
    first=false;
    d=addDays(d,-1);
  }
  return {streak,freezes:Math.min(3,Math.floor(count/5))};
}

const EGGS={lagoon:{c:'#2CC3C9',d:'#138C93',n:'Lagoon'},mango:{c:'#FFB627',d:'#D98A00',n:'Mango'},berry:{c:'#FF6FAE',d:'#D92F7E',n:'Berry'}};
function petSVG(stage,eggKey,anim=true){
  const E=EGGS[eggKey]||EGGS.lagoon,c=E.c,d=E.d,ink='#1B1A3A';
  const shadow=`<ellipse cx="100" cy="184" rx="58" ry="9" fill="rgba(27,26,58,.25)"/>`;
  const eyes=(y,sz=9)=>`<g><ellipse cx="82" cy="${y}" rx="${sz}" ry="${sz*1.15}" fill="${ink}"/><ellipse cx="118" cy="${y}" rx="${sz}" ry="${sz*1.15}" fill="${ink}"/><circle cx="85" cy="${y-4}" r="${sz*.35}" fill="#fff"/><circle cx="121" cy="${y-4}" r="${sz*.35}" fill="#fff"/></g>`;
  const egg=`<path d="M100 40 C140 40 156 100 156 128 C156 160 132 182 100 182 C68 182 44 160 44 128 C44 100 60 40 100 40Z" fill="${c}" stroke="${ink}" stroke-width="4"/><circle cx="78" cy="96" r="9" fill="#fff" opacity=".55"/><circle cx="122" cy="140" r="12" fill="#fff" opacity=".45"/><circle cx="96" cy="160" r="6" fill="#fff" opacity=".5"/>`;
  let body='';

  else {
    const big=stage>=3,r=stage===2?46:stage===3?54:60,cy=stage===2?110:118;
    let extra='';
    if(stage>=4) extra+=`<path d="M152 150 C182 150 186 118 168 112" fill="none" stroke="${ink}" stroke-width="4"/><path d="M152 150 C178 148 180 122 168 112" fill="none" stroke="${c}" stroke-width="8" stroke-linecap="round"/><path d="M80 ${cy-r+6} L88 ${cy-r-16} L98 ${cy-r+2} L106 ${cy-r-20} L116 ${cy-r+4} L124 ${cy-r-12} L128 ${cy-r+10}" fill="${d}" stroke="${ink}" stroke-width="4" stroke-linejoin="round"/>`;
    const ears=big?`<ellipse cx="62" cy="${cy-r+16}" rx="12" ry="18" transform="rotate(-25 62 ${cy-r+16})" fill="${d}" stroke="${ink}" stroke-width="4"/><ellipse cx="138" cy="${cy-r+16}" rx="12" ry="18" transform="rotate(25 138 ${cy-r+16})" fill="${d}" stroke="${ink}" stroke-width="4"/>`:'';
    const feet=big?`<ellipse cx="78" cy="176" rx="16" ry="9" fill="${d}" stroke="${ink}" stroke-width="4"/><ellipse cx="122" cy="176" rx="16" ry="9" fill="${d}" stroke="${ink}" stroke-width="4"/>`:'';
    const arms=stage>=4?`<ellipse cx="${100-r+4}" cy="${cy+14}" rx="10" ry="16" transform="rotate(30 ${100-r+4} ${cy+14})" fill="${d}" stroke="${ink}" stroke-width="4"/><ellipse cx="${100+r-4}" cy="${cy+14}" rx="10" ry="16" transform="rotate(-30 ${100+r-4} ${cy+14})" fill="${d}" stroke="${ink}" stroke-width="4"/>`:'';
    const shell=stage===2?`<path d="M50 140 L62 128 L74 142 L88 126 L100 142 L112 126 L126 142 L138 128 L150 140 C150 168 130 182 100 182 C70 182 50 168 50 140Z" fill="#FFF6DD" stroke="${ink}" stroke-width="4" stroke-linejoin="round"/>`:'';
    const face=`${eyes(cy-6,big?10:9)}<path d="M90 ${cy+14} Q100 ${cy+24} 110 ${cy+14}" fill="none" stroke="${ink}" stroke-width="4" stroke-linecap="round"/>${big?`<ellipse cx="68" cy="${cy+10}" rx="8" ry="5" fill="#FF8FB8" opacity=".8"/><ellipse cx="132" cy="${cy+10}" rx="8" ry="5" fill="#FF8FB8" opacity=".8"/>`:''}`;
    const shades=stage>=5?`<g><rect x="66" y="${cy-18}" width="30" height="20" rx="8" fill="${ink}"/><rect x="104" y="${cy-18}" width="30" height="20" rx="8" fill="${ink}"/><path d="M96 ${cy-10} L104 ${cy-10}" stroke="${ink}" stroke-width="4"/><path d="M72 ${cy-14} L80 ${cy-14}" stroke="#fff" stroke-width="3" stroke-linecap="round"/></g><g transform="translate(132 ${cy-r+8})"><circle r="7" fill="#FF2D85"/><circle cx="9" cy="-4" r="7" fill="#FF2D85"/><circle cx="4" cy="8" r="7" fill="#FF2D85"/><circle cx="4" cy="1" r="5" fill="#FFB627"/></g>`:'';
    body=`<g class="${anim?'bob':''}">${extra}${ears}${feet}${arms}<circle cx="100" cy="${cy}" r="${r}" fill="${c}" stroke="${ink}" stroke-width="4"/><ellipse cx="100" cy="${cy+r*0.45}" rx="${r*0.55}" ry="${r*0.32}" fill="#fff" opacity=".35"/>${face}${shades}${shell}</g>`;
  }
  return `<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${shadow}${body}</svg>`;
}

function sizeFlip(){const fl=$('#flip');if(!fl)return;const inn=fl.querySelector('.flip-in');let hmax=320;fl.querySelectorAll('.face').forEach(f=>{const prev=f.style.position;f.style.position='relative';hmax=Math.max(hmax,f.scrollHeight);f.style.position=prev;});inn.style.minHeight=hmax+'px';}
window.addEventListener('resize',()=>{if(Q)sizeFlip();});
function updateFoot(){
  $('#qBack').disabled=Q.page===0;
  const last=Q.page===Q.items.length-1;
  $('#qNext').textContent=last?'Finish quest':'Next';
  $('#qNext').disabled=!pageDone(Q.page);
}
$('#qBack').onclick=()=>{if(Q&&Q.page>0){Q.page--;renderPage();}};
$('#qNext').onclick=()=>{
  if(!Q||!pageDone(Q.page))return;

/* --- answer areas --- */
function answerHTML(it,st,src){ // src carries tpl/table/opts/hint/solution
  let h='';
  if(src.table){
    const t=src.table;let bi=0;
    h+=`<div class="tbl-wrap"><table class="tbl"><tr><th>x</th>${t.xs.map(x=>`<td>${nf(x)}</td>`).join('')}</tr><tr><th>y</th>${t.ys.map((y,k)=>t.missing.includes(k)?`<td><input class="bx" data-b="${bi++}" aria-label="y when x is ${x2s(t.xs[k])}" autocomplete="off"></td>`:`<td>${nf(y)}</td>`).join('')}</tr></table></div>`;
    h+=`<p class="note">Type a negative number with the − button if you need it.</p>`;
  } else if(src.tpl){
    h+=`<div class="ans-row">${src.tpl.map(p=>typeof p==='string'?`<span>${mHTML(p)}</span>`:`<input class="bx" data-b="${p.b}" aria-label="Answer box ${p.b+1}" autocomplete="off">`).join('')}</div>`;
    if(src.note)h+=`<p class="note">${esc(src.note)}</p>`;
  } else if(src.opts){
    const diag=!!src.opts[0].d;
    h+=`<div class="opts ${diag?'diag':''}">${src.opts.map((o,k)=>`<button class="opt" data-o="${k}"><span class="let">${LET[k]}</span>${diag?toSVG(o.d):`<span>${mHTML(o.m)}</span>`}</button>`).join('')}</div>`;
  }
  h+=`<div class="check-row">${src.opts?'':'<button class="btn primary" data-act="check">Check</button>'}<button class="btn hint-btn" data-act="hint">💡 Hint</button></div>
      <div class="feedback" aria-live="polite"></div>`;
  return h;
}
const x2s=x=>x<0?'minus '+(-x):String(x);
function stepsHTML(it,st){
  const n=it.steps.length;
  let h=it.terms?`<div class="expr ${st.steps>=1?'g':''}" id="expr">${it.terms.map((t,k)=>`<span class="term ${k<2?'t1':'t2'}">${mHTML(t)}</span>`).join(' ')}</div>`:'';
  h+=`<div class="pool-h">Your working</div><div class="stack" id="stack">${st.steps===0?'<div class="stack-empty">Tap the correct first step below.</div>':''}${it.steps.slice(0,st.steps).map((s,k)=>stepBtn(s,k,true)).join('')}</div>`;
  if(st.steps<it.steps.length){
    h+=`<div class="pool-h">Which step comes next?</div><div class="pool" id="pool">${it.pool.filter(p=>p>=n||p>=st.steps).map(p=>p<n?stepBtn(it.steps[p],p,false):stepBtn(it.distract[p-n],p,false)).join('')}</div><div class="feedback" id="stepFb" aria-live="polite"></div>`;
  } else {
    h+=`<div class="pool-h">${esc(it.final.prompt)}</div>`+answerHTML(it,st,it.final);
  }
  return h;
}
function stepBtn(s,p,inStack){return `<button class="step" data-p="${p}" ${inStack?'tabindex="-1"':''}><span class="sl">${inStack?`<span class="no">${p+1}</span>`:''}${esc(s.l)}</span>${s.m?`<span class="sm">${mHTML(s.m)}</span>`:''}</button>`;}

function wirePage(it,st){
  const root=$('#qInner');
  if(it.type==='recap'){
    const fl=$('#flip');
    fl.querySelectorAll('.face').forEach(f=>{const go=()=>{fl.classList.toggle('on');st.flipped=fl.classList.contains('on');if(!st.seen){st.seen=true;}save();renderDots();updateFoot();};f.onclick=go;f.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go();}};});
    return;
  }
  if(it.type==='steps'&&st.steps<it.steps.length){
    root.querySelectorAll('#pool .step').forEach(b=>b.onclick=()=>pickStep(it,st,+b.dataset.p,b));
    return;
  }
  const src=it.type==='steps'?it.final:it;
  restoreAnswer(src,st);
  root.querySelectorAll('[data-act="check"]').forEach(b=>b.onclick=()=>checkBoxes(src,st));
  root.querySelectorAll('[data-act="hint"]').forEach(b=>b.onclick=()=>{st.hint=true;save();showHint(src,st);});
  root.querySelectorAll('.opt').forEach(b=>b.onclick=()=>checkMCQ(src,st,+b.dataset.o));
  root.querySelectorAll('.bx').forEach(inp=>{inp.addEventListener('focus',()=>lastInput=inp);inp.addEventListener('input',()=>{st.vals[+inp.dataset.b]=inp.value;save();inp.classList.remove('ok','bad');});inp.addEventListener('keydown',e=>{if(e.key==='Enter')checkBoxes(src,st);});});
}
function pickStep(it,st,p,btn){
  const fb=$('#stepFb');
  if(p===st.steps){
    const first=btn.getBoundingClientRect();
    st.steps++;save();
    const stack=$('#stack');const empty=stack.querySelector('.stack-empty');if(empty)empty.remove();
    btn.onclick=null;btn.querySelector('.sl').insertAdjacentHTML('afterbegin',`<span class="no">${p+1}</span>`);
    stack.appendChild(btn);
    const last=btn.getBoundingClientRect();
    btn.animate([{transform:`translate(${first.left-last.left}px,${first.top-last.top}px)`},{transform:'none'}],{duration:450,easing:'cubic-bezier(.4,0,.2,1)'});
    const ex=$('#expr');
    if(ex){ex.classList.add('g');const g=it.steps[p].glow;ex.querySelectorAll('.term').forEach(t=>{t.classList.remove('glow');if(g&&(g==='all'||t.classList.contains(g))){void t.offsetWidth;t.classList.add('glow');}});}
    else {const dg=$('#qInner .diagram');if(dg){dg.classList.remove('glowbox');void dg.offsetWidth;dg.classList.add('glowbox');}}
    fb.innerHTML='';
    if(st.steps>=it.steps.length) setTimeout(()=>{const keep=$('#qScroll').scrollTop;renderPage();$('#qScroll').scrollTop=keep;},650);
  } else {
    btn.classList.remove('shake');void btn.offsetWidth;btn.classList.add('shake');
    const n=it.steps.length;
    const why=p<n?'Good step, but not yet. What has to happen before it?':it.distract[p-n].why;
    fb.innerHTML=`<div class="hint-box"><b>Not this one</b>${esc(why)}</div>`;
  }
}
function restoreAnswer(src,st){
  const root=$('#qInner');
  root.querySelectorAll('.bx').forEach(inp=>{const v=st.vals[+inp.dataset.b];if(v!=null)inp.value=v;if(st.done&&st.correct||st.late)inp.classList.add('ok');});
  if(src.opts){
    const opts=root.querySelectorAll('.opt');
    (st.wrong||[]).forEach(k=>opts[k]&&opts[k].classList.add('bad'));
    if(st.correct||st.revealed||st.late) opts[src.correct].classList.add('good');
    if(st.correct||st.late) opts.forEach(o=>o.disabled=true);
  }
  if(st.hint)showHint(src,st);
  renderFeedback(src,st);
}
function showHint(src,st){
  const fb=$('#qInner .feedback');if(!fb)return;
  if(!fb.parentNode.querySelector('.hint-box')) fb.insertAdjacentHTML('beforebegin',`<div class="hint-box"><b>💡 Hint</b>${mHTML(src.hint)}</div>`);
  const hb=$('#qInner [data-act="hint"]');if(hb)hb.classList.remove('pulse');
}
function renderFeedback(src,st,flash){
  const fb=$('#qInner .feedback');if(!fb)return;
  let h='';
  if(st.correct) h=`<div class="fb good">${st.tries===1?'Correct on the 1st try! +3 snacks 🍓':'Correct! +2 snacks 🍓'}</div>`;
  else if(st.late) h=`<div class="fb good">That's it. No snacks for this one, but now you know how.</div>`;
  else if(st.revealed) h=`<div class="fb bad">Not quite. Here is the working. You get 1 snack for sticking with it.</div>`;
  else if(st.tries===1) h=`<div class="fb bad">Not yet. Tap 💡 Hint, then try once more.</div>`;
  if(flash) h=`<div class="fb bad">${flash}</div>`+h;
  if(st.revealed) h+=`<div class="sol"><h4>Working</h4>${src.solution.map(l=>`<div class="ln">${mHTML(l)}</div>`).join('')}</div><div class="nudge">🙋 Ask a friend or ${esc(CONFIG.teacher)} to talk you through this one. You can still enter the answer.</div>`;
  fb.innerHTML=h;
  const hb=$('#qInner [data-act="hint"]');if(hb)hb.classList.toggle('pulse',st.tries===1&&!st.hint&&!st.done);
}
function resolve(st,correct){
  if(st.done&&st.revealed){ if(correct)st.late=true; return; }
  if(st.done)return;
  st.tries++;
  if(correct){st.done=true;st.correct=true;st.food=st.tries===1?3:2;}
  else if(st.tries>=2){st.done=true;st.revealed=true;st.food=1;}
}
function checkBoxes(src,st){
  if(st.correct||st.late)return;
  const inputs=[...$('#qInner').querySelectorAll('.bx')];
  const vals=inputs.map(i=>parseStudentNumber(i.value));
  if(vals.some(v=>isNaN(v))){renderFeedback(src,st,'Fill every box with a number.');return;}
  const tol=src.tol!=null?src.tol:1e-6;
  let ok;
  if(src.unordered){const a=[...vals].sort((x,y)=>x-y),b=[...src.ans].sort((x,y)=>x-y);ok=a.every((v,k)=>Math.abs(v-b[k])<=tol);}
  else if(src.unorderedFrom!=null){const u=src.unorderedFrom,a=vals.slice(u).sort((x,y)=>x-y),b=src.ans.slice(u).sort((x,y)=>x-y);
    ok=vals.slice(0,u).every((v,k)=>Math.abs(v-src.ans[k])<=tol)&&a.every((v,k)=>Math.abs(v-b[k])<=tol);}
  else ok=vals.every((v,k)=>Math.abs(v-src.ans[k])<=tol);
  resolve(st,ok);save();
  inputs.forEach((inp,k)=>{inp.classList.remove('ok','bad');void inp.offsetWidth;inp.classList.add(ok?'ok':'bad');});
  if(!ok){const row=$('#qInner .ans-row')||$('#qInner .tbl');if(row){row.classList.remove('shake');void row.offsetWidth;row.classList.add('shake');}}
  renderFeedback(src,st);renderDots();updateFoot();
}
function checkMCQ(src,st,k){
  if(st.correct||st.late)return;
  const opts=$('#qInner').querySelectorAll('.opt');
  if((st.wrong||[]).includes(k))return;
  const ok=k===src.correct;
  resolve(st,ok);
  if(!ok){st.wrong=st.wrong||[];st.wrong.push(k);opts[k].classList.add('bad','shake');}
  save();
  if(ok){opts[k].classList.add('good');opts.forEach(o=>o.disabled=true);}
  else if(st.revealed) opts[src.correct].classList.add('good');
  renderFeedback(src,st);renderDots();updateFoot();
}
function finishQuest(){
  const qs=qState(Q.id);const firstTime=!qs.completedAt;
  const beforeFood=totalFood()-questStats(Q.id).food;
  if(firstTime){qs.completedAt=todayISO();save();}
  Q.finished=true;renderDots();

  $('#qInner').innerHTML=`<div class="q-card stk finish"><div class="hop">${petSVG(st,S.profile.egg)}</div>

    ${QUESTS[Q.id].week===8&&QUESTS[Q.id].day===5?`<div class="shot">🏆 That was the final boss! Go to My report card and screenshot it for ${esc(CONFIG.teacher)}.</div>`:''}
    <button class="btn primary" id="finHome">Back to home</button></div>`;
  $('#finHome').onclick=closeQuest;

function openReport(){
  const keys=[];WEEKS.forEach(w=>{for(let d=1;d<=5;d++)keys.push(['w'+w.n+'d'+d,w.n,d]);});
  const built=keys.filter(([id])=>QUESTS[id]);
  let done=0,cor=0,tot=0,tries=0;
  built.forEach(([id])=>{const s=questStats(id);if(s.complete)done++;cor+=s.correct;tot+=s.total;tries+=s.tries;});
  const food=totalFood(),st=stageOf(food),{streak}=streakInfo();
  const totalQuests=built.length;
  let rows='';
  WEEKS.forEach(w=>{
    rows+=`<tr><td class="wk">Wk ${w.n}</td>`;
    for(let d=1;d<=5;d++){const id='w'+w.n+'d'+d;
      if(!QUESTS[id]){rows+='<td class="c-soon">–</td>';continue;}
      const s=questStats(id);
      if(s.complete) rows+=`<td class="c-done"><b>${s.pct}%</b><br>${s.correct}/${s.total} · ${s.tries}t</td>`;
      else if(!isOpen(w.n,d)) rows+=`<td class="c-soon">${fmtDate(dayDate(w.n,d))}</td>`;

    }

  });

    <div class="topline"><button class="btn" id="repBack">← Home</button></div>
    <div class="shot">📸 Screenshot this whole card and send it to ${esc(CONFIG.teacher)}</div>
    <div class="rep-card stk">
      <div class="rep-top">${petSVG(st,S.profile.egg,false)}<div><h2>${esc(S.profile.name)}</h2><div>${esc(CONFIG.klass)}</div><div class="note">Report made ${fmtDate(todayISO())} ${new Date().getFullYear()}, ${new Date().toLocaleTimeString('en-SG',{hour:'2-digit',minute:'2-digit'})}</div></div></div>
      <div class="rep-sum"><div><b>${done}/${totalQuests}</b>quests done</div><div><b>${tot?Math.round(100*cor/tot):0}%</b>correct</div><div><b>${tries}</b>tries used</div><div><b>${streak}</b>day streak</div></div>
      <table class="rep-grid"><tr><th></th><th>Mon</th><th>Tue</th><th>Wed</th><th>Thu</th><th>Fri</th></tr>${rows}</table>
      <div class="legend">Each done day shows: % correct, then correct/total · tries used (t). "Correct" means right within 2 tries. Pet: ${esc(S.profile.pet)}, ${STAGE_NAMES[st]} (${food} snacks).</div>
    </div></div>`;
  $('#report').classList.remove('hidden');$('#report').scrollTop=0;
  $('#repBack').onclick=()=>$('#report').classList.add('hidden');
}

    this.cur.push(p.join(' ')+' h '+this._op(st));}
  circle(x,y,r,st){const k=0.5523*r;const P=(a,b)=>this._x(a)+' '+this._y(b);
    this.cur.push([P(x+r,y)+' m',P(x+r,y+k)+' '+P(x+k,y+r)+' '+P(x,y+r)+' c',P(x-k,y+r)+' '+P(x-r,y+k)+' '+P(x-r,y)+' c',P(x-r,y-k)+' '+P(x-k,y-r)+' '+P(x,y-r)+' c',P(x+k,y-r)+' '+P(x+r,y-k)+' '+P(x+r,y)+' c'].join(' ')+' h '+this._op(st));}
  _build(){
    const objs=[];const add=s=>{objs.push(s);return objs.length;};
    const f1=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
    const f2=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
    const pagesId=objs.length+1;add('PAGES');
    const kids=[];
    for(const pg of this.pages){const content=pg.join('\n');const cid=add('<< /Length '+content.length+' >>\nstream\n'+content+'\nendstream');
      kids.push(add('<< /Type /Page /Parent '+pagesId+' 0 R /MediaBox [0 0 595.28 841.89] /Resources << /Font << /F1 '+f1+' 0 R /F2 '+f2+' 0 R >> >> /Contents '+cid+' 0 R >>'));}
    objs[pagesId-1]='<< /Type /Pages /Kids ['+kids.map(k=>k+' 0 R').join(' ')+'] /Count '+kids.length+' >>';
    const cat=add('<< /Type /Catalog /Pages '+pagesId+' 0 R >>');
    let out='%PDF-1.4\n';const offs=[];
    objs.forEach((o,i)=>{offs.push(out.length);out+=(i+1)+' 0 obj\n'+o+'\nendobj\n';});
    const xref=out.length;out+='xref\n0 '+(objs.length+1)+'\n0000000000 65535 f \n'+offs.map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('');
    out+='trailer\n<< /Size '+(objs.length+1)+' /Root '+cat+' 0 R >>\nstartxref\n'+xref+'\n%%EOF';
    const bytes=new Uint8Array(out.length);for(let i=0;i<out.length;i++)bytes[i]=out.charCodeAt(i)&255;
    return new Blob([bytes],{type:'application/pdf'});
  }
  output(kind){const b=this._build();if(kind==='blob')return b;return URL.createObjectURL(b);}
  save(name){const url=URL.createObjectURL(this._build());const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();return url;}
}

/* =========================================================
   PDF WORKSHEET
   ========================================================= */
const PT=0.3528;
const pdfTxt=s=>s.replace(/≤/g,'<=').replace(/≥/g,'>=').replace(/≈/g,'=').replace(/√/g,'sqrt').replace(/π/g,'pi').replace(/θ/g,'angle ').replace(/∩/g,'n-shape').replace(/≠/g,'is not');
function pdfAtoms(doc,nodes,fs){
  const atoms=[];let cur=null;
  const add=part=>{if(!cur){cur={parts:[],space:false};atoms.push(cur);}cur.parts.push(part);};
  for(const n of nodes){
    if(n.k==='t'){for(const w of n.v.split(/( +)/)){if(!w)continue;if(/^ +$/.test(w)){if(cur)cur.space=true;cur=null;}else add({k:'t',v:pdfTxt(w)});}}
    else if(n.k==='sup')add({k:'sup',v:pdfTxt(plain(n.v))});
    else add({k:'frac',n:pdfTxt(plain(n.n)),d:pdfTxt(plain(n.d))});
  }
  const pw=p=>{if(p.k==='t'){doc.setFontSize(fs);return doc.getTextWidth(p.v);}if(p.k==='sup'){doc.setFontSize(fs*0.65);return doc.getTextWidth(p.v)+0.3;}doc.setFontSize(fs*0.85);return Math.max(doc.getTextWidth(p.n),doc.getTextWidth(p.d))+1.6;};
  atoms.forEach(a=>{a.w=a.parts.reduce((s,p)=>s+pw(p),0);a.frac=a.parts.some(p=>p.k==='frac');});
  doc.setFontSize(fs);const sp=doc.getTextWidth(' ');
  return {atoms,sp,pw};
}
function drawParts(doc,parts,x,base,fs,pw){
  for(const p of parts){
    const w=pw(p);
    if(p.k==='t'){doc.setFontSize(fs);doc.text(p.v,x,base);}
    else if(p.k==='sup'){doc.setFontSize(fs*0.65);doc.text(p.v,x+0.15,base-fs*PT*0.38);}
    else {doc.setFontSize(fs*0.85);const c=x+w/2;doc.text(p.n,c,base-fs*PT*0.5,{align:'center'});doc.setLineWidth(0.3);doc.line(x+0.4,base-fs*PT*0.3,x+w-0.4,base-fs*PT*0.3);doc.text(p.d,c,base+fs*PT*0.55,{align:'center'});}
    x+=w;
  }
  doc.setFontSize(fs);return x;
}
function richBlock(doc,markup,x,y,maxW,fs,dry){ // returns height
  const {atoms,sp,pw}=pdfAtoms(doc,parseM(markup),fs);
  const lines=[];let line=[],lw=0;
  atoms.forEach(a=>{const need=(line.length?sp:0)+a.w;if(line.length&&lw+need>maxW){lines.push(line);line=[a];lw=a.w;}else{line.push(a);lw+=need;}});
  if(line.length)lines.push(line);
  let yy=y;
  for(const ln of lines){
    const hasF=ln.some(a=>a.frac),lh=fs*PT*(hasF?2.3:1.5);
    if(!dry){let xx=x;const base=yy+fs*PT*(hasF?1.25:1.0);ln.forEach((a,k)=>{xx=drawParts(doc,a.parts,xx,base,fs,pw);xx+=sp;});}
    yy+=lh;
  }
  return yy-y;
}
function inlineRich(doc,markup,x,base,fs){const {atoms,sp,pw}=pdfAtoms(doc,parseM(markup),fs);let xx=x;atoms.forEach((a,k)=>{xx=drawParts(doc,a.parts,xx,base,fs,pw);if(a.space||k<atoms.length-1&&a.space)xx+=sp;});return xx;}
function inlineWidth(doc,markup,fs){const {atoms,sp}=pdfAtoms(doc,parseM(markup),fs);return atoms.reduce((s,a)=>s+a.w+(a.space?sp:0),0);}
const pdfNum=v=>{const r=Math.round(v*100)/100;return (r<0?'–':'')+Math.abs(r);};
function pdfDrawing(doc,sp,x,y,w,h){
  // fit preserving aspect if equal, else stretch
  const pad=sp.axes?6:2;
  let sx=(w-2*pad)/(sp.xmax-sp.xmin),sy=(h-2*pad)/(sp.ymax-sp.ymin),ox=x+pad,oy=y+pad;
  if(sp.equal){const s=Math.min(sx,sy);ox+=((w-2*pad)-(sp.xmax-sp.xmin)*s)/2;oy+=((h-2*pad)-(sp.ymax-sp.ymin)*s)/2;sx=sy=s;}
  const X=v=>ox+(v-sp.xmin)*sx,Y=v=>oy+(sp.ymax-v)*sy;
  if(sp.grid){doc.setDrawColor(200,215,212);doc.setLineWidth(0.12);
    for(let v=Math.ceil(sp.xmin/sp.grid.dx)*sp.grid.dx;v<=sp.xmax+1e-9;v+=sp.grid.dx)doc.line(X(v),Y(sp.ymin),X(v),Y(sp.ymax));
    for(let v=Math.ceil(sp.ymin/sp.grid.dy)*sp.grid.dy;v<=sp.ymax+1e-9;v+=sp.grid.dy)doc.line(X(sp.xmin),Y(v),X(sp.xmax),Y(v));}
  if(sp.axes){doc.setDrawColor(27,26,58);doc.setLineWidth(0.35);doc.setFontSize(6.5);doc.setTextColor(27,26,58);
    const hasY0=sp.ymin<=0&&sp.ymax>=0,hasX0=sp.xmin<=0&&sp.xmax>=0;
    if(hasY0)doc.line(X(sp.xmin),Y(0),X(sp.xmax),Y(0));
    if(hasX0)doc.line(X(0),Y(sp.ymin),X(0),Y(sp.ymax));
    const y0=hasY0?0:sp.ymin,x0=hasX0?0:sp.xmin;
    if(!sp.axes.nonum) for(let v=Math.ceil(sp.xmin/sp.axes.xstep)*sp.axes.xstep;v<=sp.xmax+1e-9;v+=sp.axes.xstep){if(Math.abs(v)<1e-9)continue;doc.text(pdfNum(v),X(v),Y(y0)+2.6,{align:'center'});}
    if(!sp.axes.nonum) for(let v=Math.ceil(sp.ymin/sp.axes.ystep)*sp.axes.ystep;v<=sp.ymax+1e-9;v+=sp.axes.ystep){doc.text(pdfNum(v),X(x0)-1,Y(v)+(Math.abs(v)<1e-9?2.4:0.9),{align:'right'});}
    doc.setFontSize(8);if(hasY0)doc.text('x',X(sp.xmax)-1.5,Y(0)-1.2);if(hasX0)doc.text('y',X(0)+1.2,Y(sp.ymax)+2.5);}
  for(const it of sp.items){
    if(it.k==='path'){
      const lw={curve:0.5,line:0.55,tri:0.45,arc:0.25,ink:0.35,seg:0.45}[it.c]||0.35;
      doc.setLineWidth(it.w?it.w*0.17:lw);
      if(it.c==='arc')doc.setDrawColor(110,115,140);else doc.setDrawColor(27,26,58);
      if(it.dash)doc.setLineDashPattern([1.2,1],0);
      const pts=it.closed?[...it.pts,it.pts[0]]:it.pts;
      for(let k=1;k<pts.length;k++){const c=clipSeg(pts[k-1],pts[k],sp);if(c)doc.line(X(c[0][0]),Y(c[0][1]),X(c[1][0]),Y(c[1][1]));}
      if(it.dash)doc.setLineDashPattern([],0);
    } else if(it.k==='cross'){doc.setDrawColor(27,26,58);doc.setLineWidth(0.3);const cx=X(it.x),cy=Y(it.y),r=0.9;doc.line(cx-r,cy-r,cx+r,cy+r);doc.line(cx-r,cy+r,cx+r,cy-r);}
    else if(it.k==='dot'){doc.setFillColor(27,26,58);doc.circle(X(it.x),Y(it.y),0.9,'F');}
    else if(it.k==='label'){doc.setFontSize(Math.max(7,(it.size||18)*0.42));doc.setFont('helvetica','bold');doc.setTextColor(27,26,58);doc.text(it.t,X(it.x),Y(it.y)+1.1,{align:'center'});doc.setFont('helvetica','normal');}
  }
  doc.setDrawColor(27,26,58);
}
function makeWeekPDF(wn){
  const w=WEEKS[wn-1];
  const doc=new MiniPDF();
  const L=16,R=194,Wd=R-L,BOT=282;let y=0,page=1;
  const footer=()=>{doc.setFontSize(8);doc.setTextColor(110,115,140);doc.text(`${S.profile.name}  |  Week ${wn} worksheet  |  page ${page}`,105,291,{align:'center'});doc.setTextColor(27,26,58);};
  const newPage=()=>{footer();doc.addPage();page++;y=16;};
  const ensure=h=>{if(y+h>BOT)newPage();};
  // header band
  doc.setFillColor(14,124,134);doc.rect(0,0,210,30,'F');
  doc.setTextColor(255,255,255);doc.setFont('helvetica','bold');doc.setFontSize(18);
  doc.text(`Week ${wn} worksheet: ${w.title}`,L,13);
  doc.setFont('helvetica','normal');doc.setFontSize(10);
  doc.text(`${S.profile.name}   |   ${CONFIG.klass}`,L,21);
  doc.text('Your numbers are unique to you.',R,21,{align:'right'});
  doc.setTextColor(27,26,58);y=38;
  doc.setFontSize(10.5);
  y+=richBlock(doc,'Complete this worksheet on your iPad first. Show your working in the boxes. Then open the quest and submit your answers.',L,y,Wd,10.5);
  y+=3;
  let qn=0;
  for(let d=1;d<=5;d++){
    const id='w'+wn+'d'+d;if(!QUESTS[id])continue;
    const items=buildQuest(id);qn=0;
    ensure(30);
    doc.setFillColor(255,182,39);doc.roundedRect(L,y,Wd,10,2,2,'F');
    doc.setFont('helvetica','bold');doc.setFontSize(13);doc.text(`Day ${d}: ${QUESTS[id].title}`,L+3,y+7);doc.setFont('helvetica','normal');
    y+=15;
    for(const it of items){
      if(it.type==='recap'){
        const lines=it.pdfSteps.map((s,k)=>(k+1)+'.  '+s);
        let hh=10;lines.forEach(l=>hh+=richBlock(doc,l,0,0,Wd-10,10.5,true));if(it.ex)it.ex.forEach(l=>hh+=richBlock(doc,l,0,0,Wd-20,10.5,true));
        ensure(hh+4);
        doc.setDrawColor(14,124,134);doc.setLineWidth(0.5);doc.roundedRect(L,y,Wd,hh,2,2,'S');
        doc.setFont('helvetica','bold');doc.setFontSize(11);doc.text('Key idea: '+pdfTxt(it.front),L+4,y+6.5);doc.setFont('helvetica','normal');
        let yy=y+9;lines.forEach(l=>{yy+=richBlock(doc,l,L+4,yy,Wd-10,10.5);});
        if(it.ex){it.ex.forEach(l=>{yy+=richBlock(doc,l,L+10,yy,Wd-20,10.5);});}
        y+=hh+6;continue;
      }
      qn++;
      const prompt=it.pdfPrompt||it.prompt;
      const ph=richBlock(doc,prompt,0,0,Wd-14,12,true);
      const tagTxt=[it.tag?(it.tag==='Boss'?'Boss question':'Throwback: '+it.from):'',it.eoy?'Fix my '+it.eoy:'',it.thinking?'Think question':''].filter(Boolean).join('  |  ');
      const tagH=tagTxt?5:0;
      let first=(it.table?24:0)+(it.space||40)+17;
      if(it.diagram&&!it.pdfNoDiagram)first=Math.min(95*svgAspect(it.diagram),80)+4;
      else if(it.opts&&it.opts[0].d)first=((Wd-18)/2)*Math.min(0.74,svgAspect(it.opts[0].d))+9;
      ensure(tagH+ph+first+4);
      if(tagH){doc.setFontSize(8);doc.setTextColor(110,115,140);doc.text(pdfTxt(tagTxt),L+12,y+3);doc.setTextColor(27,26,58);y+=tagH;}
      doc.setFont('helvetica','bold');doc.setFontSize(12);doc.text(`Q${qn}`,L,y+4.3);doc.setFont('helvetica','normal');
      y+=richBlock(doc,prompt,L+12,y,Wd-14,12)+2;
      if(it.diagram&&!it.pdfNoDiagram){const dw=Math.min(95,80/svgAspect(it.diagram)),dh=dw*svgAspect(it.diagram);ensure(dh+4);doc.setDrawColor(27,26,58);doc.setLineWidth(0.3);pdfDrawing(doc,it.diagram,L+12,y,dw,dh);y+=dh+4;}
      if(it.table){const t=it.table,cw=Math.min(18,(Wd-24)/ (t.xs.length+1)),ch=9;ensure(2*ch+6);
        doc.setLineWidth(0.35);doc.setFontSize(11);
        ['x','y'].forEach((lab,r)=>{doc.rect(L+12,y+r*ch,cw,ch);doc.setFont('helvetica','bold');doc.text(lab,L+12+cw/2,y+r*ch+6,{align:'center'});doc.setFont('helvetica','normal');
          t.xs.forEach((x,k)=>{doc.rect(L+12+cw*(k+1),y+r*ch,cw,ch);const v=r===0?x:(t.missing.includes(k)?null:t.ys[k]);if(v!==null)doc.text(String(v),L+12+cw*(k+1.5),y+r*ch+6,{align:'center'});});});
        y+=2*ch+5;}
      const optsSrc=it.type==='steps'?null:it.opts;
      if(optsSrc){
        if(optsSrc[0].d){const gw=(Wd-12-6)/2,gh=gw*Math.min(0.74,svgAspect(optsSrc[0].d));
          for(let r=0;r<2;r++){ensure(gh+8);for(let c2=0;c2<2;c2++){const k=r*2+c2,ox=L+12+c2*(gw+6);
            doc.setDrawColor(27,26,58);doc.setLineWidth(0.3);doc.roundedRect(ox,y,gw,gh+6,2,2,'S');
            doc.setFont('helvetica','bold');doc.setFontSize(11);doc.text(LET[k],ox+3,y+5);doc.setFont('helvetica','normal');
            pdfDrawing(doc,optsSrc[k].d,ox+2,y+5,gw-4,gh);}
            y+=gh+9;}
        } else {
          const cw=(Wd-12)/2,widest=Math.max(...optsSrc.map(o=>inlineWidth(doc,o.m,12)));
          if(widest<=cw-12){for(let r=0;r<2;r++){ensure(10);for(let c2=0;c2<2;c2++){const k=r*2+c2;doc.setFont('helvetica','bold');doc.setFontSize(12);doc.text(LET[k]+'.',L+12+c2*cw,y+6);doc.setFont('helvetica','normal');inlineRich(doc,optsSrc[k].m,L+20+c2*cw,y+6,12);}y+=10;}}
          else {for(let k=0;k<4;k++){const oh=richBlock(doc,optsSrc[k].m,0,0,Wd-24,12,true);ensure(oh+3);doc.setFont('helvetica','bold');doc.setFontSize(12);doc.text(LET[k]+'.',L+12,y+4.3);doc.setFont('helvetica','normal');y+=richBlock(doc,optsSrc[k].m,L+20,y,Wd-24,12)+2;}}
          y+=1;}
      }
      // working space
      const sh=it.space||40;ensure(sh+14);
      doc.setDrawColor(150,200,195);doc.setLineWidth(0.3);doc.roundedRect(L+12,y,Wd-12,sh,2,2,'S');
      doc.setFontSize(8);doc.setTextColor(110,115,140);doc.text(optsSrc?'Working / reason':'Working',L+15,y+4.5);doc.setTextColor(27,26,58);
      doc.setDrawColor(215,232,229);doc.setLineWidth(0.15);for(let ly=y+12;ly<y+sh-2;ly+=8)doc.line(L+15,ly,R-3,ly);
      y+=sh+3;
      // answer line
      doc.setFontSize(12);
      if(optsSrc||it.type==='steps'&&false){doc.text('Answer:',L+12,y+6);doc.setLineWidth(0.3);doc.setDrawColor(27,26,58);doc.line(L+31,y+6.5,L+60,y+6.5);doc.setFontSize(9);doc.setTextColor(110,115,140);doc.text('(A, B, C or D)',L+62,y+6);doc.setTextColor(27,26,58);}
      else if(it.tpl){let xx=L+12;doc.text('Answer:',xx,y+6.5);xx+=20;doc.setDrawColor(27,26,58);doc.setLineWidth(0.35);
        for(const p of it.tpl){if(typeof p==='string'){xx=inlineRich(doc,p.trim(),xx+2,y+6.5,12)+2;}else{doc.rect(xx,y,18,9);xx+=18;}}}
      else if(it.type==='steps'){doc.text('Answer:',L+12,y+6.5);doc.setLineWidth(0.3);doc.setDrawColor(27,26,58);doc.line(L+31,y+7,R-40,y+7);}
      else if(it.table){doc.setFontSize(9);doc.setTextColor(110,115,140);doc.text('Fill the blanks in the table above.',L+12,y+5);doc.setTextColor(27,26,58);}
      y+=14;
    }
  }
  footer();
  S.dl=S.dl||{};S.dl[wn]=true;save();if(!Q&&!$('#home').classList.contains('hidden'))setTimeout(renderHome,50);
  const fname=`Week${wn}_worksheet_${S.profile.name.replace(/[^A-Za-z0-9]+/g,'_')}.pdf`;
  let url='';try{url=doc.save(fname);}catch(e){try{url=doc.output('bloburl');}catch(e2){}}
  toast(`Worksheet ready. If it did not download, <a href="${url}" target="_blank" rel="noopener">open it here</a>.`,9000);
}

  b.addEventListener('pointerdown',e=>e.preventDefault());
